name: Build Windows Package

# 在 GitHub 网页端 Actions 页面点 "Run workflow" 即可一键打包（无需本地环境）。
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    name: 打包 Windows 版 PoolCoverage
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        run: |
          python -m py_compile app.py core.py

      - name: 准备 ffmpeg.exe（用 pip 自带二进制，避免外部下载失效）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --quiet imageio-ffmpeg
          python -c "import imageio_ffmpeg, shutil; shutil.copyfile(imageio_ffmpeg.get_ffmpeg_exe(), 'ffmpeg.exe')"
          if (-not (Test-Path 'ffmpeg.exe')) { throw '没能得到 ffmpeg.exe' }
          Get-Item ffmpeg.exe | Select-Object FullName, Length

      - name: 用 PyInstaller 打包
        run: >
          pyinstaller --noconfirm --onedir --windowed --name PoolCoverage
          --add-binary "ffmpeg.exe;."
          app.py

      - name: 检查打包结果
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "dist/PoolCoverage/PoolCoverage.exe")) {
            throw "打包失败：dist/PoolCoverage/PoolCoverage.exe 不存在"
          }
          Get-ChildItem "dist/PoolCoverage" | Select-Object Name, Length

      - name: 压缩成 zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "dist/PoolCoverage" -DestinationPath "PoolCoverage-windows-x64.zip" -Force
          Get-Item "PoolCoverage-windows-x64.zip" | Select-Object FullName, Length

      - name: 上传安装包（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: PoolCoverage-windows-x64
          path: PoolCoverage-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
