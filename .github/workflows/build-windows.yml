name: Build Windows Package

# 在 GitHub 网页端 Actions 页面点 "Run workflow" 即可一键打包（无需本地环境）。
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    name: 打包 Windows 版 PoolCoverage
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        run: |
          python -m py_compile app.py core.py

      - name: 下载 ffmpeg.exe（BtbN FFmpeg-Builds win64 gpl）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $dest = Join-Path $env:RUNNER_TEMP "ffmpeg"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          Write-Host "下载 $url"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $exe = Get-ChildItem -Path $dest -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "压缩包里没有找到 ffmpeg.exe" }
          Copy-Item $exe.FullName -Destination "ffmpeg.exe" -Force
          Get-Item "ffmpeg.exe" | Select-Object FullName, Length

      - name: 用 PyInstaller 打包
        run: >
          pyinstaller --noconfirm --onedir --windowed --name PoolCoverage
          --add-binary "ffmpeg.exe;."
          app.py

      - name: 检查打包结果
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "dist/PoolCoverage/PoolCoverage.exe")) {
            throw "打包失败：dist/PoolCoverage/PoolCoverage.exe 不存在"
          }
          Get-ChildItem "dist/PoolCoverage" | Select-Object Name, Length

      - name: 压缩成 zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "dist/PoolCoverage" -DestinationPath "PoolCoverage-windows-x64.zip" -Force
          Get-Item "PoolCoverage-windows-x64.zip" | Select-Object FullName, Length

      - name: 上传安装包（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: PoolCoverage-windows-x64
          path: PoolCoverage-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
